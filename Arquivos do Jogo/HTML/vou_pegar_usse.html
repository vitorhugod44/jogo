<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala Sombria</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cenario {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #111; /* se a imagem falhar, o fundo não fica preto total */
            overflow: hidden;
        }

        /* Camada da imagem: é ela que "respira", assim o texto não escurece junto */
        .fundo {
            position: absolute;
            inset: 0;
            background-image: url("vou_puxar_seu_pezinho.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            animation: respiracaoTela 4s ease-in-out infinite;
        }

        @keyframes respiracaoTela {
            0%, 100% {
                transform: scale(1);
                filter: brightness(0.8) contrast(1.1);
            }
            50% {
                transform: scale(1.03);
                filter: brightness(0.5) contrast(1.3) blur(1px);
            }
        }

        /* Vinheta: a visão se estreitando junto com a respiração */
        .vinheta {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.95) 85%);
            pointer-events: none;
            z-index: 3;
            animation: vinheta 4s ease-in-out infinite;
        }

        @keyframes vinheta {
            0%, 100% { opacity: 0.5; transform: scale(1.2); }
            50%      { opacity: 1;   transform: scale(0.9); }
        }

        /* Mensagens de falta de ar */
        .mensagem {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ff3333;
            border: 2px solid #ff3333;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 5px;
            text-align: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            width: auto;
            max-width: 80%;
            animation-fill-mode: forwards;
        }

        .msg-1 {
            animation-name: exibirMsg;
            animation-duration: 4s;
            animation-delay: 1s;
        }

        .msg-2 {
            animation-name: exibirMsg;
            animation-duration: 4s;
            animation-delay: 5.5s;
        }

        @keyframes exibirMsg {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Jumpscare: aparece de repente por cima de tudo */
        .jumpscare {
            position: absolute;
            inset: 0;
            background-image: url("vou_puxar_seu_pezinho.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            animation: acaoJumpscare 0.4s ease 10s forwards;
        }

        @keyframes acaoJumpscare {
            0% {
                opacity: 0;
                transform: scale(0.8);
                filter: brightness(0.2);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
                filter: brightness(1.8) contrast(2) saturate(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1) contrast(1.3);
            }
        }

        /* Mensagem final */
        .mensagem-final {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #ff3333;
            border: 2px solid #ff3333;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 5px;
            text-align: center;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            animation: exibirMsgFinal 0.5s ease 10.4s forwards;
        }

        @keyframes exibirMsgFinal {
            to {
                opacity: 1;
                pointer-events: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fundo, .vinheta { animation: none; }
        }
    </style>
</head>

<body>

    <div class="cenario">
        <div class="fundo"></div>
        <div class="vinheta"></div>

        <div class="mensagem msg-1">O cirurgião checa seus batimentos e te injeta uma substância estranha, você começa a sentir muita dificuldade para respirar...</div>
        <div class="mensagem msg-2">Sua visão escurece e logo apaga...</div>

        <!-- Jumpscare e mensagem final -->
        <div class="jumpscare"></div>
        <div class="mensagem-final">Encontre um jeito de sair desse hospital abandonado</div>
    </div>

    <script>
        // Jumpscare começa em 10s e a mensagem final em 10,4s.
        // Depois de 13s o espectador é levado para a próxima página.
        setTimeout(function () {
            window.location.href = "HTML.html";
        }, 13000);
    </script>

</body>
</html>
