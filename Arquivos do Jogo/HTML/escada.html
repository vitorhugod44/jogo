<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escada</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .cenario {
            position: relative;
            aspect-ratio: 4 / 3;
            height: 100vh;
            max-width: 100vw;
            background-image: url("escada.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Área clicável da escada totalmente invisível */
        .link-descer {
            position: absolute;
            top: 20%;
            left: 35%;
            width: 30%;
            height: 40%;
            cursor: pointer;
            background-color: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div class="cenario">
        <!-- Link para a próxima página -->
        <a href="proxima_sala.html" class="link-descer"></a>
    </div>

</body>
</html>
