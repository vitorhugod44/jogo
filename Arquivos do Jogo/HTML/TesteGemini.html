<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>O Hospital</title>
        <link rel="icon" href="o_hospital_psiquiatrico.ico" type="image/x-icon">
        <style>
            /* Layout geral da página */
            body {
                background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)), url('Gemini_Generated_Image_bz534hbz534hbz53\ \(1\).jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                color: #e0e0e0;
                font-family: 'Courier New', Courier, monospace;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            /* Áudio no canto */
            .audio_no_canto {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 9999;
                opacity: 0.7;
                transition: opacity 0.3s;
            }
            .audio_no_canto:hover {
                opacity: 1;
            }

            /* Container do Título */
            .Titulo {
                margin-bottom: 20px;
                text-align: center;
            }
            .Titulo img {
                max-width: 100%;
                height: auto;
                filter: drop-shadow(0 0 10px rgba(183, 28, 28, 0.6));
            }

            /* Botão Jogar Estilizado */
            .botaoplay {
                display: inline-block;
                margin: 20px 0 35px 0;
                padding: 15px 50px;
                border-radius: 8px;
                border: 2px solid #b71c1c;
                background-color: rgba(183, 28, 28, 0.2);
                color: #fff;
                text-align: center;
                font-size: 28px;
                font-family: monospace;
                font-weight: bold;
                text-decoration: none;
                letter-spacing: 2px;
                transition: all 0.3s ease-in-out;
                box-shadow: 0 0 10px rgba(183, 28, 28, 0.4);
            }

            .botaoplay:hover {
                background-color: #b71c1c;
                color: #000;
                box-shadow: 0 0 25px #b71c1c;
                transform: scale(1.05);
            }

            /* Caixa de avisos/créditos gerais */
            .escrita {
                text-align: center;
                color: #ccc;
                font-family: monospace;
                font-size: 18px;
                max-width: 650px;
                padding: 15px 20px;
                margin-bottom: 20px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                background-color: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(5px);
            }

            .escrita a {
                color: #e53935;
                text-decoration: none;
            }
            .escrita a:hover {
                text-decoration: underline;
            }

            /* Bloco de Desenvolvedores */
            .bloco-desenvolvedores {
                background-color: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(5px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                padding: 20px 30px;
                width: 100%;
                max-width: 450px;
                margin: 0 auto;
                font-family: monospace;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            }

            .bloco-desenvolvedores h2 {
                margin-top: 0;
                margin-bottom: 15px;
                font-size: 24px;
                font-family: monospace;
                text-align: center;
                color: #fff;
                letter-spacing: 1px;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                padding-bottom: 8px;
            }

            .bloco-desenvolvedores ul {
                margin: 0;
                padding-left: 20px;
                font-family: monospace;
                font-size: 18px;
                text-align: left;
                color: #bbb;
            }

            .bloco-desenvolvedores li {
                margin: 8px 0;
                transition: color 0.2s;
            }

            .bloco-desenvolvedores li:hover {
                color: #fff;
            }
        </style>
    </head>

    <body>
        <div class="Titulo">
            <img src="O Hospital Foda.jpg" alt="Placa O Hospital">
        </div>

        <a href="Introdução.html" class="botaoplay">JOGAR</a>

        <div class="escrita">
            <p>Jogo feito como projeto final da disciplina de Técnicas e Lógica de Programação.</p>
            <p>Imagens cedidas pela <a href="https://www.airsoftcompany.com.br" target="_blank">Airsoft Company</a>, muito obrigado!</p>
        </div>
            
        <div class="bloco-desenvolvedores">
            <h2>Desenvolvedores</h2>
            <ul>
                <li>Conrado de Lara Claro</li>
                <li>Rafael Gurski</li>
                <li>Vitor Hugo de Almeida</li>
            </ul>
        </div>

        <audio autoplay loop controls class="audio_no_canto">
            <source src="Sombra Residual.mp3" type="audio/mpeg">
        </audio>
    </body>
</html>
