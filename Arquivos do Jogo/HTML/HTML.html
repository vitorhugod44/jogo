<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Página</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .cenario {
            position: relative;
            aspect-ratio: 4 / 3;
            height: 100vh;
            max-width: 100vw;
            background-image: url("Corredor.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Porta lateral invisível, mas clicável */
        .porta-lateral {
            position: absolute;
            top: 13%;
            left: 24%;
            width: 6%;
            height: 60%;
            cursor: pointer;
            background-color: transparent;
            clip-path: polygon(0 0, 100% 8%, 100% 94%, 0 100%);
        }

        /* Porta vermelha trancada */
        .porta-vermelha {
            position: absolute;
            top: 34%;
            left: 45%;
            width: 5.4%;
            height: 12.9%;
            cursor: pointer;
            background-color: transparent;
        }

        /* Mensagem de porta trancada */
        .mensagem {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #222;
            color: white;
            padding: 20px 35px;
            border: 2px solid red;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="cenario">

        <!-- Porta lateral levando para a sala 1 -->
        <a href="sala1.html" class="porta-lateral"></a>

        <!-- Porta vermelha trancada -->
        <div class="porta-vermelha"
             onclick="mostrarMensagem()"></div>

        <!-- Mensagem -->
        <div class="mensagem" id="mensagem">
            🔒 Porta trancada!
        </div>

    </div>

    <script>
        function mostrarMensagem() {
            const mensagem = document.getElementById("mensagem");

            mensagem.style.display = "block";

            setTimeout(function() {
                mensagem.style.display = "none";
            }, 2000);
        }
    </script>

</body>
</html>
