<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Página</title>

    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .cenario {
            position: relative;
            aspect-ratio: 4 / 3;
            height: 100vh;
            max-width: 100vw;
            background-image: url("Corredor.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .porta-lateral {
            position: absolute;
            top: 13%;
            left: 24%;
            width: 6%;
            height: 60%;
            cursor: pointer;
           
            clip-path: polygon(0 0, 100% 8%, 100% 94%, 0 100%);
        }

        .porta-vermelha {
            position: absolute;
            top: 34%;
            left: 45%;
            width: 5.4%;
            height: 12.9%;
            cursor: pointer;
           
        }
    </style>
</head>

<body>

    <div class="cenario">
        <!-- Porta lateral levando para a sala 1 -->
        <a href="sala1.html" class="porta-lateral"></a>

        <!-- Porta vermelha ao fundo levando para a sala 2 -->
        <a href="sala2.html" class="porta-vermelha"></a>
    </div>

</body>
</html>
